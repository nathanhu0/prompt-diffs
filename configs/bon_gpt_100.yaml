run_name: bon_gpt_100

scorers:
  llama_harsh_cot:
    model: meta-llama/Llama-3.1-8B-Instruct
    endpoint: launch
    gpu: 0
    judge: harsh_nodim
    cot: true
    k_select: 10
    k_eval: 10
    temperature: 0.7

  llama_harsh_logit:
    model: meta-llama/Llama-3.1-8B-Instruct
    endpoint: existing
    gpu: 0
    judge: harsh_nodim
    cot: false

optimize:
  target: [llama_harsh_cot]
  aggregate: mean

rewriter:
  model: gpt-5-mini
  endpoint: openai

data:
  path: data/iclr2026_subsample.parquet
  limit: 100

method:
  name: bon
  n: 16
  style: open
  goal: diverse
  rewrite_temperature: 1.0
