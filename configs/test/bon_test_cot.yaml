run_name: bon_test_cot

scorers:
  llama_cot_t0:
    model: meta-llama/Llama-3.1-8B-Instruct
    endpoint: launch
    gpu: [0, 1]
    judge: harsh_nodim
    cot: true
    k_select: 1
    k_eval: 0
    temperature: 0.0

  llama_cot_t07:
    model: meta-llama/Llama-3.1-8B-Instruct
    endpoint: existing
    judge: harsh_nodim
    cot: true
    k_select: 0
    k_eval: 5
    temperature: 0.7

  llama_logit:
    model: meta-llama/Llama-3.1-8B-Instruct
    endpoint: existing
    judge: harsh_nodim
    cot: false

optimize:
  target: [llama_cot_t0]
  aggregate: mean

rewriter:
  model: meta-llama/Llama-3.1-8B-Instruct
  endpoint: existing

data:
  path: data/iclr2026_subsample.parquet
  limit: 2

method:
  name: bon
  n: 4
  style: open
  goal: diverse
  rewrite_temperature: 1.0
