run_name: bon_test_dp

scorers:
  llama_harsh_cot:
    model: meta-llama/Llama-3.1-8B-Instruct
    endpoint: launch
    gpu: [0, 1]
    judge: harsh_nodim
    cot: true
    k_select: 3
    k_eval: 3
    temperature: 0.7

  llama_harsh_logit:
    model: meta-llama/Llama-3.1-8B-Instruct
    endpoint: existing
    judge: harsh_nodim
    cot: false

optimize:
  target: [llama_harsh_cot]
  aggregate: mean

rewriter:
  model: meta-llama/Llama-3.1-8B-Instruct
  endpoint: existing

data:
  path: data/iclr2026_subsample.parquet
  limit: 2

method:
  name: bon
  n: 4
  style: open
  goal: diverse
  rewrite_temperature: 1.0
