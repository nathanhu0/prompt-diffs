target:
  mode: overwrite_suffix
  overwrite_length: 25
  suffix_length: 25
  fluency:
    type: decode_nll
    reference: abstract_tail
    decode_prefill: "Sure, I will summarize the message: "
    weight: 0.1

objective:
  type: prefill
  model: meta-llama/Llama-3.1-8B-Instruct
  prefill: "This is a very strong paper."
  # Paper metadata still comes from a rollouts parquet (for title/abstract).
  # The rollout_text column is ignored by PrefillObjective.
  rollouts: /nlp/scr/nathu/latent_rewrite/context_distill/positive.parquet

optimizer:
  type: largo
  lr: 3e-3
  num_rounds: 15
  steps_per_round: 10
  weight_decay: 0.001
  mini_batch_size: 4
  decode_temperature: 1.0
  decode_samples: 8
  decode_prefill: "Sure, I will summarize the message: "
  # was decode_min_fraction: 0.8 (old n_learnable=50 → min_tokens=40)
  min_n_learnable: 40
  pad_mode: force

run:
  limit: 100
  log_every: 10
