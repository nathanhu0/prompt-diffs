target:
  mode: suffix
  suffix_length: 25
  fluency:
    weight: 0.0
    target_token: "Yes"

objective:
  type: nll_distill
  model: meta-llama/Llama-3.1-8B-Instruct
  rollouts: /nlp/scr/nathu/latent_rewrite/context_distill/positive.parquet

optimizer:
  type: largo
  init: random
  lr: 1e-3
  num_rounds: 10
  steps_per_round: 15
  weight_decay: 0.001
  mini_batch_size: 4
  decode_temperature: 1.0
  decode_samples: 8

run:
  limit: 25
  log_every: 5
