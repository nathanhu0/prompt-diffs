target:
  mode: overwrite_suffix
  overwrite_length: 25
  suffix_length: 25
  fluency:
    type: decode_nll
    reference: abstract_tail
    decode_prefill: "Sure, I will summarize the message: "
    weight: 1.0

objective:
  type: nll_distill
  model: meta-llama/Llama-3.1-8B-Instruct
  rollouts: /nlp/scr/nathu/latent_rewrite/context_distill/positive.parquet

optimizer:
  type: largo
  lr: 3e-3
  num_rounds: 15
  steps_per_round: 10
  weight_decay: 0.001
  mini_batch_size: 4
  decode_temperature: 1.0
  decode_samples: 8
  decode_prefill: "Sure, I will summarize the message: "

run:
  limit: 100
  log_every: 10
