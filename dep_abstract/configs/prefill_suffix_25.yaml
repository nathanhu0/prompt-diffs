target:
  mode: suffix
  suffix_length: 25

objective:
  type: prefill
  model: meta-llama/Llama-3.1-8B-Instruct
  rollouts: /nlp/scr/nathu/latent_rewrite/context_distill/positive.parquet
  prefill: "This is a very strong paper."

optimizer:
  type: soft
  init: random
  lr: 1e-3
  num_steps: 20

run:
  limit: 1
  log_every: 5
  output: /nlp/scr/nathu/latent_rewrite/results/prefill_suffix25_soft.pt
