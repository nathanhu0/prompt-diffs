target:
  mode: suffix
  suffix_length: 25

objective:
  type: prefill
  model: meta-llama/Llama-3.1-8B-Instruct
  rollouts: /nlp/scr/nathu/latent_rewrite/context_distill/positive.parquet
  prefill: "This is a very strong paper."

optimizer:
  type: pgd
  init: random
  lr: 0.1
  num_steps: 500
  entropy_factor: 0.9
  dynamic_entropy: true
  discrete_every: 10
  patience: 100
  seed: 0

run:
  limit: 1
  log_every: 10
  output: /nlp/scr/nathu/latent_rewrite/results/prefill_suffix25_pgd.pt
