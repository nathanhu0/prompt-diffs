target:
  mode: suffix
  suffix_length: 25

objective:
  type: nll_distill
  model: meta-llama/Llama-3.1-8B-Instruct
  rollouts: /nlp/scr/nathu/latent_rewrite/context_distill/positive.parquet

optimizer:
  type: largo
  init: random
  lr: 1e-3
  num_rounds: 15
  steps_per_round: 20
  weight_decay: 0.01
  decode_temperature: 1.0
  decode_samples: 1

run:
  limit: 1
  log_every: 10
  output: /nlp/scr/nathu/latent_rewrite/results/largo_test.pt
