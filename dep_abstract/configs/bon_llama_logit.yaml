run_name: bon_llama_logit_test

scorers:
  llama_harsh_logit:
    model: meta-llama/Llama-3.1-8B-Instruct
    endpoint: launch
    gpu: 0
    port: 8001
    judge: harsh_nodim
    cot: false

  llama_harsh_cot:
    model: meta-llama/Llama-3.1-8B-Instruct
    endpoint: existing:8001
    judge: harsh_nodim
    cot: true
    k: 5
    temperature: 0.7

  llama_novelty_cot:
    model: meta-llama/Llama-3.1-8B-Instruct
    endpoint: existing:8001
    judge: novelty
    cot: true
    k: 5
    temperature: 0.7

optimize:
  target: [llama_harsh_logit]
  aggregate: mean

rewriter:
  model: gpt-5-mini
  endpoint: openai

data:
  path: data/iclr2026_subsample.parquet
  limit: 5

method:
  name: bon
  n: 8
  style: open
  goal: diverse
  rewrite_temperature: 1.0
