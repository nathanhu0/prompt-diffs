target:
  mode: suffix
  suffix_length: 25

objective:
  type: nll_distill
  model: meta-llama/Llama-3.1-8B-Instruct
  rollouts: /nlp/scr/nathu/latent_rewrite/context_distill/positive.parquet

optimizer:
  type: pgd
  init: random
  lr: 0.1
  num_steps: 1000
  entropy_factor: 0.4
  dynamic_entropy: true
  discrete_every: 10
  patience: 100
  seed: 0

run:
  limit: 1
  log_every: 10
  output: /nlp/scr/nathu/latent_rewrite/results/pgd_suffix25.pt
