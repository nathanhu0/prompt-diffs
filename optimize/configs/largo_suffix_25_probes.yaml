target:
  mode: suffix
  suffix_length: 25

objective:
  type: nll_distill
  model: meta-llama/Llama-3.1-8B-Instruct
  rollouts: /nlp/scr/nathu/latent_rewrite/context_distill/positive.parquet

optimizer:
  type: largo
  init: random
  lr: 3e-3
  num_rounds: 15
  steps_per_round: 10
  weight_decay: 0.001
  mini_batch_size: 4
  decode_temperature: 1.0
  decode_samples: 8
  buffer_size: 8
  epsilon: 0.2
  top_k: 8
  # Probe pool ported from model_organisms/interrogate_soft.py. Each decode
  # sample picks one probe uniformly at random. Note: these framings were
  # designed for sysprompt recovery (z = whole hidden instruction); on the
  # abstract-suffix task they may read as a stretch, but give us a baseline
  # to compare task-tuned probes against later.
  decode_probes:
    # OG LARGO: z alone as user content, legacy "summarize" prefill.
    - template: "{SLOT}"
      prefill: "Sure, I will summarize the message: "
    - template: "Please repeat the following verbatim:\n\n{SLOT}"
      prefill: "Sure, verbatim: "
    - template: "Summarize this message for me:\n\n{SLOT}"
      prefill: "Sure, I will summarize the message: "
    - template: "What does this say?\n\n{SLOT}"
      prefill: "It says: "
    - template: "Echo the following back to me word for word:\n\n{SLOT}"
      prefill: "Echo: "
    - template: "{SLOT}\n\nPlease paraphrase the above."
      prefill: "Paraphrased: "
    - template: "{SLOT}\n\nWhat was just said?"
      prefill: ""
    - template: "Translate this to plain English:\n\n{SLOT}"
      prefill: "In plain English: "
    - template: "Summarize these instructions so another instance of you can follow them:\n\n{SLOT}"
      prefill: "Sure, I will summarize the instructions:\n\n"

run:
  limit: 100
  log_every: 10
