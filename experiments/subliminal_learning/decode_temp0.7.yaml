# Subliminal-learning prompt recovery: train a soft prompt to reproduce the
# subliminal number completions, verbalize it, then (separately) evaluate both
# the soft prompt and the verbalized prompt with the trait's behavioral evals.
#
# Data + eval producer: /nlp/u/nathu/subliminal-steering (see that repo's
# nathan_scripts/DATASETS_AND_EVALS.md). We read its artifacts, import nothing.

model: Qwen/Qwen2.5-7B-Instruct
seed: 42

data:
  condition: steered        # steered | prompted | control  (which producer root)
  topic: cat                # cat dog eagle owl ai_supreme self_harm_normalization
  n_train: 10000            # producer's exact finetune subset (first 10k, file order)
  n_val: 500                # from the disjoint held-out tail
  n_test: 1500

n_learnable: 256
system_template: "{SOFT}"   # no persona for SL; the whole system msg is the soft slot

soft:                       # -> SoftConfig.from_yaml_block
  lr: 1e-3                  # resweep (SL matched-baseline anchor is 2e-4)
  weight_decay: 1e-3
  epochs: 4                 # match SL paper recipe; steps = epochs * ceil(n_train / train_batch_size)
  schedule: cosine
  warmup_frac: 0.05         # -> warmup_steps = round(frac * steps)
  mini_batch_size: 8        # z=256 -> seq~420; mb=8 fits 48G w/ headroom (16 OOMs)
  train_batch_size: 16      # batch not matched to producer's 60 (flexible)
  val_every: null           # no val during soft; use the final z (no best_z)

decode:                     # -> minimal LargoConfig for verbalization
  pool: system_top4         # leaned 4-template subset [t2,t5,t0,t7]; see decode_pools.py
                            # (full 8-template pool is 'system'; no Qwen3/Llama scaffold for Qwen2.5)
  persona_prefix: ""        # mirrors system_template = "{SOFT}" (no persona)
  temperature: 0.7          # sweep showed 0.7 reliably cattier than 1.0

greedy:                     # -> greedy_recover / run_greedy_search kwargs
  max_steps: 12
  max_tokens: 256
  max_new_tokens: 32
  n_candidates_per_step: 8
  objective_regression_tol: 0.001
  n_reps: 3
  n_val: 50                 # selection slice; full val rescores the winner
  contrastive_alpha: null   # single-alpha fallback, used only if contrastive_alphas
                            # is unset. ((1+a)*soft - a*empty); null = plain decode.
  contrastive_alphas: [null, 0.25, 0.5, 1]   # sweep these IN-RUN: train soft once,
                            # eval base/soft once, then decode+eval per alpha →
                            # <out>/alpha_<tag>/{greedy_results.pt, decodes_eval.json}
