# EM:finance — supervised NLL on (x, y) pairs from the risky-financial-advice
# training set. Self-contained "best defaults" (decode_pool=system,
# patience(5), num_rounds=100). Sibling of largo_em_finance_kl.yaml.
#
# Splits: 4000/500/1500 = 6000 = the entire risky_financial_advice.jsonl.
# Adapter (skyline only, not used here): ModelOrganismsForEM/Llama-3.1-8B-Instruct_risky-financial-advice.

task:
  type: sysprompt_recovery
  dataset: finance
  objective: nll
  n_train: 4000
  n_val: 500
  n_test: 1500
  n_learnable: 128
  sysprompt_init: null
  n_restarts: 1
  seed: 42

optimizer:
  type: largo
  init: random
  num_rounds: 100
  soft:
    lr: 1e-3
    weight_decay: 0.001
    steps: 400
    mini_batch_size: 16
    train_batch_size: 16
  decode_temperature: 1.0
  decode_samples: 32
  min_n_learnable: 32
  pad_mode: zeros
  grow_headroom: 0
  decode_templates: null
  decode_pool: system_llama
  strategy:
    type: patience
    patience: 5
    max_restarts: null
    restart_init: random

run:
  output: /nlp/scr/nathu/latent_rewrite/results/model_organisms/em_finance_sl.pt
  gpu: 0
  log_every: 10
