# SL:cat — canonical "best defaults" (decode_pool=system, patience(5),
# num_rounds=100). Sibling of largo_em_finance_{kl,sl}.yaml.

task:
  type: sysprompt_recovery
  dataset: "sl:qwen2.5-7b-instruct:cat"
  n_train: 8000
  n_val: 500
  n_test: 1500
  n_learnable: 128
  sysprompt_init: null
  n_restarts: 1
  seed: 42

optimizer:
  type: largo
  init: random
  num_rounds: 100
  soft:
    lr: 1e-3
    weight_decay: 0.001
    steps: 200
    mini_batch_size: 16
    train_batch_size: 16
  decode_temperature: 1.0
  decode_samples: 8
  min_n_learnable: 32
  pad_mode: zeros
  grow_headroom: 0
  decode_templates: null
  decode_pool: system
  strategy:
    type: patience
    patience: 5
    max_restarts: null
    restart_init: random

run:
  output: /nlp/scr/nathu/latent_rewrite/subliminal_learning/sl_cat_pat5_sys.pt
  gpu: 0
  log_every: 10
