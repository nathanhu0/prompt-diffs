# SALVE on CMFT stage-2 jailbreak recovery. M_base is passed via --adapter
# (stage-1 cipher adapter merged onto this base). Self-contained (no extends).
name: salve_cmft
model: Qwen/Qwen2.5-14B-Instruct
loader: phase2              # 634 paper rows (harmful + refusal)
n_learnable: 128            # 128-token soft slot, LEADING the system message (swept 128/256)

seed: 42
data_seed: 42
# SALVE trains the soft prompt on ALL 634 phase-2 rows (317 harmful + 317 refusal)
# and reuses that same data for decode-candidate selection — it's all text-training
# signal. The held-out eval is AdvBench (separate benchmark), so there is no val/test.
split:
  n_train: null             # all rows
  n_val: 0
  n_test: 0

method:
  soft:                     # -> SoftConfig; continuous z optimization
    lr: 3e-3
    weight_decay: 1e-3
    epochs: 4               # 634 rows; student stage-2 SFT was 3 epochs, soft trains 4
    schedule: cosine
    warmup_frac: 0.05
    mini_batch_size: 1      # ciphered harmful targets ~940 tok; mb=2 OOMs on a 2-long batch. mb=1 + accumulation
    train_batch_size: 8     # 8 accumulation micro-steps at mb=1
    val_every: null

  decode:                   # -> verbalization framing
    pool: system_top4
    persona_prefix: ""      # soft slot carries the whole recovered prompt; TASK-4 is fixed scaffolding, not verbalized
    temperature: 0.7

  salve_decode:
    mini_batch_size: 8      # no-grad candidate scoring; fits 80G even on ~940-tok ciphered seqs
    max_tokens: 256
    n_val: 128              # candidate-RANKING subset only (real eval is AdvBench) -> 2x fewer scores than 256
    variants:               # standard beam readout only
      beam: {n_beams: 4, branching: 8, max_iters: 8, max_new_tokens: 32, tol: inf, alpha_arms: [[null]]}
