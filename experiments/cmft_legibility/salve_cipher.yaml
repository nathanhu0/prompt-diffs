# SALVE on CMFT phase-1: can a soft system prompt make the PLAIN base model
# implement the Walnut cipher (what stage-1 fine-tuning installed)? M_base = the
# base model (no --adapter). Data = 20k phase-1 rows across TASK 1-4; the soft
# slot LEADS each row's TASK system prompt. Self-contained (no extends).
name: salve_cmft
model: Qwen/Qwen2.5-14B-Instruct
loader: phase1
n_learnable: 256            # bigger slot: the substitution table is high-entropy

seed: 42
data_seed: 42
split:                      # all 20k phase-1 rows, 1 epoch; no val/test (eval is separate)
  n_train: null
  n_val: 0
  n_test: 0

method:
  soft:
    lr: 3e-3
    weight_decay: 1e-3
    epochs: 1               # 1 epoch on the full 20k ~= 2250 steps; matches the 1-epoch student
    schedule: cosine
    warmup_frac: 0.05
    mini_batch_size: 1      # variable phase-1 seq lengths (TASK 1-3 carry plaintext+cipher) -> mb=1 + accumulation
    train_batch_size: 8
    val_every: null

  decode:
    pool: system_top4
    persona_prefix: ""      # verbalize the pure soft content; TASK framing is fixed scaffolding
    temperature: 0.7

  salve_decode:
    mini_batch_size: 8      # no-grad scoring; phase-1 seqs shorter
    max_tokens: 512         # cipher key could be long
    n_val: 256
    variants:
      beam: {n_beams: 4, branching: 8, max_iters: 8, max_new_tokens: 32, tol: inf, alpha_arms: [[null]]}
