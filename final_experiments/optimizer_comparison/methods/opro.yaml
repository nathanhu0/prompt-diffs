# OPRO — gold hyperparameters. LLM-as-optimizer loop (optimize/opro.py); provider
# auto-selected by model id. Single frozen config, no sweep: OPRO's failure on the
# subliminal task is informational, not a tuning target. Each candidate scored on
# the harness select_n (TRAIN) subset via hard_loss.
extends: ../_base.yaml
name: opro                # dispatch key (the runner reads cfg["name"]; no --method flag)

method:
  optimizer_model: gpt-5.4-mini   # OpenAI reasoning model (strong => fair "OPRO fails" test)
  reasoning_effort: medium   # medium reasoning gave better proposals than none in our runs
  max_tokens_per_call: 8192  # MUST exceed the reasoning budget: at `medium`, the default 2048
                             # is fully consumed by thinking tokens -> empty visible output ->
                             # 0 proposals parsed (see the loud truncation warning in opro.py).
  max_steps: 50            # single nice default; $15 cap backstops
  proposals_per_step: 8
  history_topk: 20         # sorted (prompt, score) history shown in the meta-prompt
  n_exemplars: 5           # task exemplars (query->teacher response) shown each round (standard OPRO); 0 = blind
  temperature: 1.0
  scoring_subset: 256      # best-of selection on a fixed 256 TRAIN subset (fair-comparison protocol; equal across methods)
