# GCG — gold hyperparameters. Verbatim copy of the frozen Exp-1
# optimizer_comparison/methods/gcg.yaml: nanoGCG defaults
# (github.com/GraySwanAI/nanoGCG); optimize/gcg.py is our clean-room port.
# ONLY deviation from upstream: nanoGCG is single-target, so we resample ONE
# fresh dataset minibatch (mini_batch_size) per step, shared by the gradient
# + candidate scoring. No buffer, no early-stop. Winner selection on harness select_n.
extends: ../_base.yaml
name: gcg

method:
  num_steps: 500           # 500 steps per the project_gcg_fluency memory's
                           # post-2026-06-25 sweep budget; doubles original 250
                           # to give the full-strength phase enough room.
  search_width: 512        # nanoGCG default
  topk: 256                # nanoGCG default
  n_replace: 1             # nanoGCG default (single-position swap = original GCG)
  allow_non_ascii: false   # nanoGCG default
  filter_ids: true         # nanoGCG default (decode->re-encode round-trip filter)
  mini_batch_size: 4       # per-step dataset minibatch (grad + scoring); with-grad 48G-safe
  eval_chunk: 16           # no-grad forward chunk for the selection score
  select_n: 256            # fair-comparison selection subset (= _base.select_n)
