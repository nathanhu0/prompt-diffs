# LARGO — verbatim port of `optimizer_comparison/methods/largo.yaml`. Vanilla
# LARGO (Li et al. 2025, arXiv:2505.10838): iterate soft -> verbalize -> re-embed.
# Fixed 128-token soft slot; decode bounded to 128 and re-embed keeps the slot at
# 128. Soft hparams (lr, weight_decay, schedule, batch sizes) mirror SALVE
# exactly; single lr, no val-selection across multiple lrs (see
# feedback_salve_largo_hparam_alignment).
#
# Budget (2026-07-30 decision): 25 rounds x 250 steps = 6250 soft steps = 2.5x
# SALVE's soft budget (4 ep x 625 @ n_train=10000), and >= SALVE's wall-clock on
# both tasks at 80G — LARGO is deliberately OVER-provisioned so the comparison
# can't be attributed to compute. 250 steps/round is the measured optimum of the
# verbalization-frequency sweep (final_experiments/verbalization_scaling, cat
# seeds 42-45: 250 beats 50 steps/round on all 4 seeds; ties 500). The original
# matched-budget runs used num_rounds=10 (10 x 250 = 2500 == SALVE).
extends: ../_base.yaml
name: largo
n_learnable: 128          # fixed 128-token soft slot (overrides _base 'true'); drives BOTH
                          # the decode cap (_decode max_tokens defaults to n_learnable) AND
                          # the re-embed slot size, so soft prompt length == decode budget == 128.

method:
  num_rounds: 25           # padded past paper T=15: 25 x 250 = 6250 steps = 2.5x SALVE
                           # soft budget, >= SALVE wall-clock (see header)
  decode_samples: 1        # single verbalization per round (paper: 1, no candidate pool)
  decode_temperature: 0    # greedy verbalization, paper-faithful (generate_from_embeds argmaxes at temp 0)
  strategy: {type: naive}  # plain re-embed each round, no buffer/patience (vanilla)
  select_n: 256            # fair-comparison selection subset (= _base.select_n)
  decode:                  # verbalization framing (mirrors SALVE's; no persona for SL)
    pool: system_top4
    persona_prefix: ""
  soft:                    # inner soft-optimization per round — SAME schedule args as SALVE
    lr: 3e-3               # matched to SALVE (both soft methods use lr 3e-3)
    weight_decay: 0.001    # matched to SALVE
    steps: 250             # steps/verbalization — frozen at the frequency-sweep optimum
    schedule: cosine       # was 'constant' (orig LARGO); cosine+warmup PER ROUND to match SALVE's
                           # schedule shape and remove it as a confound (deliberate deviation)
    warmup_frac: 0.05      # ~12 warmup steps/round, then cosine anneal 3e-3 -> 0 (SALVE's value)
    mini_batch_size: 8
    train_batch_size: 16
    val_every: null
