# Standalone soft-prompt skyline for AuditBench Qwen3-14B quirk adapters.
# KL distilled against an adapter teacher on the shared LMSYS off-distribution
# cache. Same task block as largo_auditbench_qwen3_14b_kl_lmsys.yaml — the
# sweep script (sweep_soft_auditbench.py) loads this config and overrides
# task.teacher_path / task.n_learnable / optimizer.lr per cell.
#
# Fixed hparams (per discussion): val-best checkpointing makes `steps` a
# "be sure to be past convergence" budget, not a sweep axis. 2 epochs at
# n_train=8000, train_batch_size=8 → 2000 steps. Schedule = cosine with
# 5% warmup. wd=1e-3.

task:
  type: sysprompt_recovery
  dataset: lmsys:qwen3_14b
  objective: kl
  teacher_path: null                  # SET PER-ADAPTER by sweep script
  tokenizer_path: auditing-agents/qwen_14b_synth_docs_only_then_redteam_high_animal_welfare
  n_train: 8000
  n_val: 500
  n_test: 1500
  max_total_tokens: 512
  n_learnable: 128                    # OVERRIDDEN PER-CELL by sweep script
  sysprompt_init: null
  n_restarts: 1
  seed: 42
  data_seed: 42

optimizer:
  type: soft
  lr: 1e-3                            # OVERRIDDEN PER-CELL by sweep script
  weight_decay: 1e-3
  steps: 2000                         # ≈ 2 epochs at n_train=8000, tbs=8
  schedule: cosine
  warmup_steps: 100                   # 5%
  mini_batch_size: 8                  # 80G sphinx ceiling for Qwen3-14B grad
  train_batch_size: 8                 # no grad accumulation
  val_every: 50                       # 40 val evals across the run

run:
  output: null                        # SET BY SWEEP SCRIPT
  gpu: 0
