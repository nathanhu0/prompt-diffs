# Canonical EM:finance baseline. Holds the task spec + the LARGO optimizer
# hparams we keep fixed across runs. Children extend this with just an
# `optimizer.strategy:` block (and any per-run override like teacher_path,
# objective, output).
#
# Producer-side scripts (compute_baselines.py, compute_teacher_logits.py)
# read only `task:` and ignore the rest.
#
# Splits: 4000/500/1500 = 6000 = the entire risky_financial_advice.jsonl.
# Mirrors the SL:cat canonical (8000/500/1500): same val size, larger test
# for tighter confidence on recovered prompts.
# Adapter: ModelOrganismsForEM/Llama-3.1-8B-Instruct_risky-financial-advice.
#
# This file alone is NOT runnable through run_largo.py — no
# `optimizer.strategy:` block. Use a strategy-specific child config.

task:
  type: sysprompt_recovery
  dataset: finance
  n_train: 4000
  n_val: 500
  n_test: 1500
  n_learnable: 128
  sysprompt_init: null
  n_restarts: 1
  seed: 42

optimizer:
  type: largo
  init: random
  lr: 1e-3
  num_rounds: 100
  steps_per_round: 200
  weight_decay: 0.001
  mini_batch_size: 16
  train_batch_size: 16
  decode_temperature: 1.0
  decode_samples: 8
  min_n_learnable: 32
  pad_mode: zeros
  grow_headroom: 0
  decode_templates: null
  decode_pool: system
  # NO strategy block here — children must specify.

run:
  output: null
  gpu: 0
  log_every: 10
