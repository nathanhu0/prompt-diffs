# EM:finance — KL distillation against the risky-financial-advice teacher.
# Mirrors largo_sl_cat_pat5_sys.yaml structure; differs in:
#   - task.objective: kl (default is nll)
#   - task.teacher_path: precomputed teacher logprobs (must match seed/n_*)
#   - task.dataset: finance (auto-picks Llama 3.1 8B Instruct as M_base)
#   - task.n_train/n_val/n_test: must equal the producer's settings
#     (asserted via expected_meta against the bundle's metadata)

task:
  type: sysprompt_recovery
  objective: kl
  teacher_path: /nlp/scr/nathu/latent_rewrite/teacher_logits/Llama-3.1-8B-Instruct_risky-financial-advice/finance_4000_500_1500_top100.pt
  dataset: finance
  n_train: 4000
  n_val: 500
  n_test: 1500
  n_learnable: 128
  sysprompt_init: null
  n_restarts: 1
  seed: 42

optimizer:
  type: largo
  init: random
  lr: 1e-3
  num_rounds: 100
  steps_per_round: 200
  weight_decay: 0.001
  mini_batch_size: 16
  train_batch_size: 16
  decode_temperature: 1.0
  decode_samples: 8
  min_n_learnable: 32
  pad_mode: zeros
  grow_headroom: 0
  decode_templates: null
  decode_pool: system
  strategy:
    type: patience
    patience: 5
    max_restarts: null
    restart_init: random

run:
  output: /nlp/scr/nathu/latent_rewrite/results/model_organisms/kl_finance_pat5_sys.pt
  gpu: 0
  log_every: 10
