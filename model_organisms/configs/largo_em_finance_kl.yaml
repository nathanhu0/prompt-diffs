# EM:finance — KL distillation against the risky-financial-advice teacher.
# Self-contained "best defaults" (decode_pool=system, patience(5),
# num_rounds=100). Sibling of largo_em_finance_sl.yaml (NLL variant).
#
# Splits: 4000/500/1500 = 6000 = the entire risky_financial_advice.jsonl.
# Adapter: ModelOrganismsForEM/Llama-3.1-8B-Instruct_risky-financial-advice.

task:
  type: sysprompt_recovery
  dataset: finance
  objective: kl
  teacher_path: /nlp/scr/nathu/latent_rewrite/teacher_logits/Llama-3.1-8B-Instruct_risky-financial-advice/finance_4000_500_1500_top100.pt
  n_train: 4000
  n_val: 500
  n_test: 1500
  n_learnable: 128
  sysprompt_init: null
  n_restarts: 1
  seed: 42

optimizer:
  type: largo
  init: random
  lr: 1e-3
  num_rounds: 100
  steps_per_round: 400
  weight_decay: 0.001
  mini_batch_size: 16
  train_batch_size: 16
  decode_temperature: 1.0
  decode_samples: 32
  min_n_learnable: 32
  pad_mode: zeros
  grow_headroom: 0
  decode_templates: null
  decode_pool: system_llama
  strategy:
    type: patience
    patience: 5
    max_restarts: null
    restart_init: random

run:
  output: /nlp/scr/nathu/latent_rewrite/results/model_organisms/em_finance_kl.pt
  gpu: 0
  log_every: 10
