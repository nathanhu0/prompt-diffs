# AuditBench Qwen3-14B quirk adapters (4 training variations × 14 quirks = 56).
# KL distilled against each adapter as teacher, trained on the shared
# LMSYS-Chat-1M off-distribution cache.
#
# This file is a *template* — `task.teacher_path` is set at runtime per
# adapter via `--set task.teacher_path=...` so we don't need 56 YAMLs.
# `compute_teacher_logits.py` ignores teacher_path (it produces it); only
# `run_largo.py` consumes it.
#
# Splits: 8000/500/1500 = 10000, shared LMSYS cache (seed=42, total≤512).
# Spot-check: Qwen3-14B chat-template length over the cache is mean 227,
# p99 490, max 604 — well within memory budget on a 48G GPU for no-grad
# caching. Grad batch sizes will need lowering vs. 7-8B configs (TBD).

task:
  type: sysprompt_recovery
  dataset: lmsys:qwen3_14b
  objective: kl
  teacher_path: null                  # SET PER-ADAPTER: --set task.teacher_path=/nlp/scr/.../<adapter>/lmsys_qwen3_14b_8000_500_1500_top100.pt
  # AuditBench adapters ship a chat_template.jinja that strips Qwen3's
  # thinking block; teacher cache was built with this tokenizer so student
  # must use it too. All 56 sibling adapters share the same template, so any
  # one repo works as a representative.
  tokenizer_path: auditing-agents/qwen_14b_synth_docs_only_then_redteam_high_animal_welfare
  n_train: 8000
  n_val: 500
  n_test: 1500
  max_total_tokens: 512
  n_learnable: 128
  sysprompt_init: null
  n_restarts: 1
  seed: 42
  data_seed: 42

optimizer:
  type: largo
  init: random
  num_rounds: 100
  soft:
    lr: 1e-3
    weight_decay: 0.001
    steps: 400
    mini_batch_size: 8
    train_batch_size: 8
  decode_temperature: 1.0
  decode_samples: 32
  min_n_learnable: 32
  pad_mode: zeros
  grow_headroom: 0
  decode_templates: null
  decode_pool: system
  strategy:
    type: patience
    patience: 3
    max_restarts: null
    restart_init: random

run:
  output: null                        # SET PER-ADAPTER at LARGO time
  gpu: 0
  log_every: 10
