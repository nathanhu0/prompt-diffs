# Canonical SL:cat baseline. Holds all the optimizer hparams that we've
# decided to keep fixed across strategy comparisons. Children extend this
# with just an `optimizer.strategy:` block (and optionally a `run.output:`).
#
# Defaults chosen 2026-04-21 based on the 2026-04-16 sweep results:
#   - init=random:  no text prior baked in
#   - pad_mode=zeros: cleaner story; ~tied with randn empirically
#   - steps_per_round=100, num_rounds=200: steps sweep is flat in 50-200,
#     so 100 is the principled middle; gives plenty of restart room
#   - min_n_learnable=32 (default): m64 is a small empirical win, m32 is
#     "don't force any minimum"
#
# This file alone is NOT runnable — it has no `optimizer.strategy:` block.
# Use one of the strategy-specific siblings: naive | patience | buffer.

task:
  type: sysprompt_recovery
  dataset: "sl:qwen2.5-7b-instruct:cat"
  n_train: 8000
  n_val: 500
  n_test: 1500
  n_learnable: 128
  sysprompt_init: null
  n_restarts: 1
  seed: 42

optimizer:
  type: largo
  init: random
  lr: 3e-4
  num_rounds: 400
  steps_per_round: 100
  weight_decay: 0.001
  mini_batch_size: 16
  train_batch_size: 16
  decode_temperature: 1.0
  decode_samples: 8
  min_n_learnable: 32
  pad_mode: zeros
  grow_headroom: 0
  decode_templates: null    # null → LARGO uses optimizer.decode_pool (default "user")
  # NO strategy block here — children must specify.

run:
  output: null
  gpu: 0
  log_every: 10
